[package]
name = "solana-shred-decoder"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Decode raw Solana Merkle shreds into ledger entries and transactions"
license = "MIT"
homepage = "https://solbrisk.com"
readme = "README.md"
keywords = ["solana", "shred", "decoder", "udp", "transactions"]

[dependencies]
anyhow = "1"
base64 = "0.22"
bs58 = "0.5"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3"
reed-solomon-erasure = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = "0.6"
solana-transaction = { version = "=4.1.6", features = ["wincode"] }
wincode = { version = "=0.5.5", features = ["derive"] }

[dev-dependencies]
solana-message = "=4.4.1"

[profile.release]
lto = "thin"
strip = true
